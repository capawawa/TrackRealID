version: '3'

services:
  tracker-web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - TRACKER_WEB_ADMIN_USER=${TRACKER_WEB_ADMIN_USER:?Set TRACKER_WEB_ADMIN_USER}
      - TRACKER_WEB_ADMIN_PASSWORD=${TRACKER_WEB_ADMIN_PASSWORD:?Set TRACKER_WEB_ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./templates:/app/templates
      - ./.env:/app/.env
    restart: unless-stopped
